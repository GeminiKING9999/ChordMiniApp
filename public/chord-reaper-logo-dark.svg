<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main purple gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6c3ce0"/>
    </linearGradient>
    <!-- Neon blue glow gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <!-- Subtle outer glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Inner glow for the waveform -->
    <filter id="waveGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0a0a1a"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#1a1a3e" stroke-width="2"/>
  
  <!-- Scythe blade - sweeping curved blade shape -->
  <g filter="url(#neonGlow)">
    <!-- Main blade arc - a bold curved scythe shape -->
    <path d="M 340 100 
             C 420 120, 460 200, 440 300 
             C 420 380, 360 420, 280 430 
             C 300 400, 340 360, 360 300 
             C 380 240, 370 180, 340 140 
             Z" 
          fill="url(#bladeGrad)" opacity="0.95"/>
    
    <!-- Blade edge highlight -->
    <path d="M 340 100 
             C 420 120, 460 200, 440 300 
             C 420 380, 360 420, 280 430"
          fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.8"/>
  </g>
  
  <!-- Scythe handle/staff -->
  <g filter="url(#neonGlow)">
    <line x1="310" y1="130" x2="140" y2="400" stroke="url(#bladeGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="310" y1="130" x2="140" y2="400" stroke="#c084fc" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- Sound waveform bars - integrated into the blade area -->
  <g filter="url(#waveGlow)" opacity="0.95">
    <!-- Waveform bars arranged in an arc pattern inside the blade -->
    <rect x="195" y="210" width="8" height="40" rx="4" fill="url(#glowGrad)" transform="rotate(-10, 199, 230)"/>
    <rect x="215" y="190" width="8" height="70" rx="4" fill="url(#glowGrad)" transform="rotate(-8, 219, 225)"/>
    <rect x="235" y="175" width="8" height="100" rx="4" fill="url(#glowGrad)" transform="rotate(-5, 239, 225)"/>
    <rect x="255" y="170" width="8" height="110" rx="4" fill="url(#glowGrad)" transform="rotate(-2, 259, 225)"/>
    <rect x="275" y="180" width="8" height="90" rx="4" fill="url(#glowGrad)" transform="rotate(0, 279, 225)"/>
    <rect x="295" y="195" width="8" height="60" rx="4" fill="url(#glowGrad)" transform="rotate(3, 299, 225)"/>
    <rect x="315" y="210" width="8" height="35" rx="4" fill="url(#glowGrad)" transform="rotate(5, 319, 228)"/>
  </g>
  
  <!-- Musical note accent - a small treble-clef-inspired swoosh near the blade tip -->
  <g filter="url(#waveGlow)">
    <path d="M 160 310 
             C 150 280, 170 260, 190 270 
             C 210 280, 200 310, 180 320 
             C 165 328, 155 340, 160 355
             L 158 370"
          fill="none" stroke="url(#glowGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <!-- Note head -->
    <ellipse cx="155" cy="372" rx="12" ry="9" fill="url(#glowGrad)" opacity="0.85" transform="rotate(-20, 155, 372)"/>
  </g>
  
  <!-- Subtle ring accent -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.2"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.15"/>
</svg>
